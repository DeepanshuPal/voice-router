[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-router"
version = "0.1.0"
description = "One OpenAI-compatible API in front of every STT, TTS, and LLM provider - routed per call by cost, latency, or benchmark."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Deepanshu Pal"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
agents = ["pipecat-ai>=0.0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/DeepanshuPal/voice-router"

[tool.setuptools.packages.find]
include = ["voice_router*"]
