name: leaderboard

on:
  push:
    paths:
      - "benchmarks/**"
      - "scripts/generate_leaderboard.py"
      - "voice_router/providers/**"
  schedule:
    # Weekly refresh - provider quality drifts.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs: rapid successive pushes must not race on the final git push.
concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run benchmark matrix
        # Samples + references are committed (FLEURS clips). With no provider
        # secrets the matrix produces mock-only results and the site generator
        # keeps the SAMPLE DATA banner; add DEEPGRAM_API_KEY / GROQ_API_KEY /
        # OPENAI_API_KEY as repo secrets for real measurements.
        run: python scripts/run_matrix.py
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          GLADIA_API_KEY: ${{ secrets.GLADIA_API_KEY }}
          SPEECHMATICS_API_KEY: ${{ secrets.SPEECHMATICS_API_KEY }}
          REV_API_KEY: ${{ secrets.REV_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          RIME_API_KEY: ${{ secrets.RIME_API_KEY }}
          SMALLEST_API_KEY: ${{ secrets.SMALLEST_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Generate leaderboard site
        run: python scripts/generate_leaderboard.py

      - name: Guard against clobbering real results
        # If this run produced no real (non-mock) provider rows, keep the
        # committed results.json and site as they were - never overwrite real
        # measurements with mock/sample output.
        run: |
          if ! python3 -c "
          import json, sys
          d = json.load(open('benchmarks/results.json'))
          ok = [r for r in d.get('runs', []) if r.get('status') == 'ok']
          real = any(not r.get('provider', '').startswith('mock') for r in ok)
          sys.exit(0 if (real and not d.get('sample_data')) else 1)
          "; then
            echo "no real provider runs - keeping committed results"
            git checkout -- docs benchmarks/results.json
          fi

      - name: Commit refreshed results and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs benchmarks/results.json
          git diff --cached --quiet || git commit -m "chore: refresh benchmark leaderboard"
          git pull --rebase -X theirs origin main
          git push
