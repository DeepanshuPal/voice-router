name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lightweight per-push check: compile + import + config validation only.
# No provider API calls - free-tier quota is spent by the nightly
# leaderboard/arena workflows, not here.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio numpy
      - run: python -m compileall -q voice_router benchmarks scripts
      - run: pytest -q
      - name: Import providers and validate config
        run: |
          python - <<'PY'
          import yaml
          from voice_router.providers import stt, tts  # noqa: F401
          cfg = yaml.safe_load(open("config/providers.yaml"))
          assert cfg, "config/providers.yaml is empty"
          print("providers config OK:", ", ".join(sorted(cfg)))
          PY
