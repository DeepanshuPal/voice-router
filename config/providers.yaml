# Provider registry. A provider with no API key in the environment is skipped
# at startup, so ship this file as-is and let env vars decide what's live.

routing:
  default_strategy: benchmark   # benchmark | cost | latency | round_robin
  fallback: true                # try the next candidate when one fails
  request_timeout_s: 30

stt:
  deepgram:
    models: [nova-3, nova-2]
    cost_per_minute_usd: 0.0043
    default_latency_ms: 300
    languages: [en, es, hi, fr, de, pt, ja, ko, zh, it, nl, ru]
    env_key: DEEPGRAM_API_KEY
  openai-whisper:
    models: [whisper-1, gpt-4o-transcribe]
    cost_per_minute_usd: 0.006
    default_latency_ms: 900
    languages: [en, es, hi, fr, de, pt, ja, ko, zh, it, nl, ru]
    env_key: OPENAI_API_KEY
  groq-whisper:
    models: [whisper-large-v3, whisper-large-v3-turbo]
    cost_per_minute_usd: 0.0027
    default_latency_ms: 400
    languages: [en, es, hi, fr, de, pt, ja, ko, zh, it, nl, ru]
    env_key: GROQ_API_KEY

  assemblyai:
    models: [universal-3-5-pro]
    cost_per_minute_usd: 0.0035
    default_latency_ms: 15000
    languages: [en, es, hi, fr, de, ja]
    env_key: ASSEMBLYAI_API_KEY
  gladia:
    models: [v2]
    cost_per_minute_usd: 0.0102
    default_latency_ms: 15000
    languages: [en, es, hi, fr, de, ja]
    env_key: GLADIA_API_KEY
  speechmatics:
    models: [enhanced]
    cost_per_minute_usd: 0.0067
    default_latency_ms: 15000
    languages: [en, es, hi, fr, de, ja]
    env_key: SPEECHMATICS_API_KEY
  cartesia-stt:
    models: [ink-whisper]
    cost_per_minute_usd: 0.0067  # Ink-2: 3 credits/s; 1 credit ~ $0.000037 (docs.cartesia.ai/pricing)
    default_latency_ms: 800
    languages: [en, es, hi, fr, de, ja]
    env_key: CARTESIA_API_KEY
  rev:
    models: [machine]
    cost_per_minute_usd: 0.005
    default_latency_ms: 15000
    languages: [en, es, hi, fr, de, ja]
    env_key: REV_API_KEY
tts:
  elevenlabs:
    models: [eleven_multilingual_v2, eleven_flash_v2_5]
    cost_per_1k_chars_usd: 0.15
    default_latency_ms: 500
    languages: [en, es, hi, fr, de, pt, ja, ko, zh, it, nl, ru]
    env_key: ELEVENLABS_API_KEY
  openai-tts:
    models: [tts-1, tts-1-hd, gpt-4o-mini-tts]
    cost_per_1k_chars_usd: 0.015
    default_latency_ms: 700
    languages: [en, es, hi, fr, de, pt, ja, ko, zh, it, nl, ru]
    env_key: OPENAI_API_KEY
  cartesia:
    models: [sonic-2, sonic-turbo]
    cost_per_1k_chars_usd: 0.037
    default_latency_ms: 250
    languages: [en, es, hi, fr, de, pt, ja, ko, zh, it, nl, ru]
    env_key: CARTESIA_API_KEY
  deepgram-aura:
    models: [aura-2-thalia-en]   # voice is per-language; adapter maps lang -> voice
    cost_per_1k_chars_usd: 0.03  # Aura-2 pay-as-you-go, deepgram.com/pricing
    default_latency_ms: 250
    languages: [en, es, de, fr, ja]
    env_key: DEEPGRAM_API_KEY
  rime:
    models: [mistv2]   # coda used for hi/ja via model_for(); adapter maps lang -> model+voice
    cost_per_1k_chars_usd: 0.04  # Arcana/coda tier $40/M chars; Mist is $30/M (rime.ai/pricing)
    default_latency_ms: 300
    languages: [en, es, fr, de, hi, ja]
    env_key: RIME_API_KEY
  groq-tts:
    models: [canopylabs/orpheus-v1-english]
    cost_per_1k_chars_usd: 0.022  # Orpheus English, per Groq launch coverage
    default_latency_ms: 300
    languages: [en]
    env_key: GROQ_API_KEY

# Mock providers are always available so the router runs with zero keys.
# Remove them for production deploys.
mock:
  enabled: true
